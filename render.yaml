# Public synthetic demo blueprint only (autoDeploy disabled).
# IMPORTANT: ATEVAL_PUBLIC_DEMO must remain "1" on any internet-accessible
# deployment so arbitrary manuscript uploads and local write routes stay disabled.
services:
  - type: web
    name: ateval-alpha-demo
    runtime: docker
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /api/v1/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ATEVAL_PUBLIC_DEMO
        value: "1"
      - key: ATEVAL_ENABLE_RESEARCH_EXPERIMENTS
        value: "0"
      - key: ATEVAL_TRUSTED_PROXY_HOPS
        value: "1"
      - key: ATEVAL_ALLOWED_HOSTS
        value: ateval-alpha-demo.onrender.com
      - key: ATEVAL_CORS_ORIGINS
        value: https://ateval-alpha-demo.onrender.com
      - key: ATEVAL_PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: ATEVAL_UPLOAD_LIMIT_BYTES
        value: "1048576"
      - key: ATEVAL_HOME
        value: /tmp/ateval-public-demo
