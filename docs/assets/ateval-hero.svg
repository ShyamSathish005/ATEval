<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ATEval academic revision research platform</title>
  <desc id="desc">A dark research canvas showing a manuscript, protected spans, analysis signals, and an author review path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".55" stop-color="#111b35"/>
      <stop offset="1" stop-color="#21143d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1420" cy="50" r="180" fill="#2563eb" opacity=".22" filter="url(#blur)"/>
  <circle cx="90" cy="500" r="180" fill="#06b6d4" opacity=".13" filter="url(#blur)"/>
  <g opacity=".11" stroke="#a5b4fc">
    <path d="M0 100h1600M0 180h1600M0 260h1600M0 340h1600M0 420h1600"/>
    <path d="M160 0v520M320 0v520M480 0v520M640 0v520M800 0v520M960 0v520M1120 0v520M1280 0v520M1440 0v520"/>
  </g>
  <g transform="translate(120 86)">
