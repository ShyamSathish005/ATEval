    <rect x="28" y="155" width="178" height="10" rx="5" fill="#0f766e" opacity=".9"/>
    <rect x="28" y="181" width="282" height="7" rx="3" fill="#cbd5e1"/>
    <rect x="28" y="199" width="240" height="7" rx="3" fill="#cbd5e1"/>
    <rect x="28" y="235" width="200" height="12" rx="6" fill="#f59e0b" opacity=".85"/>
    <rect x="28" y="263" width="262" height="7" rx="3" fill="#cbd5e1"/>
    <path d="M28 310c50-24 93 26 145 0s91 22 139-2" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g stroke="url(#glow)" stroke-width="3" fill="none" stroke-linecap="round">
