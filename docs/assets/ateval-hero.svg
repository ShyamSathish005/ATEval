    <text x="28" y="90" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="18">meaning</text>
    <text x="28" y="124" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="18">structure</text>
    <text x="28" y="158" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="18">evidence</text>
    <path d="M28 188h160" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
