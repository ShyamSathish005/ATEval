    <path d="M900 260h180"/>
    <path d="M680 260c55-105 130-105 220 0"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="500" cy="260" r="7"/><circle cx="680" cy="260" r="7"/><circle cx="900" cy="260" r="7"/><circle cx="1080" cy="260" r="7"/>
  </g>
  <g transform="translate(560 145)">
