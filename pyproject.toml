[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ateval"
version = "0.1.0a1"
description = "Local-first framework for reproducible academic text evaluation research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ui-server = [
    "fastapi==0.138.2",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
]
writing-nlp = [
    "torch==2.15.0",
    "spacy==3.8.18",
]
writing-docs = [
    "python-docx==1.2.0",
    "PyMuPDF==2.0.0",
]
writing = [
    "torch==2.15.0",
    "spacy==3.8.18",
    "python-docx==1.2.0",
    "PyMuPDF==2.0.0",
]
revision-ml = [
    "scikit-learn==1.9.1",
]
revision-transformer = [
    "torch==2.15.0",
    "transformers==4.57.6",
    "scikit-learn==1.9.1",
]
ci = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "pip-audit==2.10.1",
]
release = [
    "build==1.6.1",
    "cyclonedx-bom==7.6.0",
]

[project.scripts]
ateval = "ateval.cli:main"

[tool.setuptools.packages.find]
include = ["ateval*"]

[tool.setuptools.package-data]
ateval = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
