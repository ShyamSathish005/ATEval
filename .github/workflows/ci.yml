name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[ui-server,writing-docs,revision-ml]" pytest ruff pip-audit
      - run: ruff check --select E4,E7,E9,F821 ateval tests scripts
      - run: PYTHONPATH=. pytest -q
      - run: pip-audit --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run test:sites
      - working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ateval:ci

  release-gate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [python, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed for this commit."
