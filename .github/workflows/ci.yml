name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.2 uv==0.13.6
      - name: Sync locked Python dependencies
        run: |
          uv sync --locked --python "${{ matrix.python-version }}" --extra ui-server --extra writing-docs --extra revision-ml --extra ci
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check --select E4,E7,E9,F821 ateval tests scripts
      - name: Run Python tests
        run: |
          set -o pipefail
          mkdir -p test-results
          PYTHONPATH=. pytest -vv -ra --tb=long -s --junitxml="test-results/pytest-${{ matrix.python-version }}.xml" |& tee "test-results/pytest-${{ matrix.python-version }}.log"
      - name: Summarize Python tests
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path("test-results").glob("pytest-*.xml"))
          if not reports:
              summary = "Pytest did not produce a JUnit report. See the job log."
          else:
              root = ET.parse(reports[0]).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              tests = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              summary = f"Python ${{ matrix.python-version }}: {tests} tests, {failures} failures, {errors} errors, {skipped} skipped."
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary + "\n")
          print(summary)
          PY
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.python-version }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Audit pinned third-party dependencies
        run: |
          uv export --python "${{ matrix.python-version }}" --locked --no-dev --extra ui-server --extra writing-docs --extra revision-ml --extra ci --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements-audit.txt" > /dev/null
          pip-audit --strict --no-deps --disable-pip --require-hashes --requirement "$RUNNER_TEMP/requirements-audit.txt"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run test:sites
      - working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ateval:ci

  release-gate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [python, frontend, docker]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All required CI jobs passed for this commit."
