services:
  ateval:
    build:
      context: .
      dockerfile: Dockerfile
    image: ateval:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ATEVAL_PORT:-8000}:8000"
    environment:
      ATEVAL_HOME: /data
      ATEVAL_UPLOAD_LIMIT_BYTES: ${ATEVAL_UPLOAD_LIMIT_BYTES:-26214400}
      ATEVAL_CORS_ORIGINS: ""
    volumes:
      - ateval-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
volumes:
  ateval-data:
