services:
  ateval:
    build:
      context: .
      dockerfile: Dockerfile
    image: ateval:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ATEVAL_PORT:-8000}:${PORT:-8000}"
    environment:
      ATEVAL_HOME: /data
      ATEVAL_UPLOAD_LIMIT_BYTES: ${ATEVAL_UPLOAD_LIMIT_BYTES:-26214400}
      ATEVAL_CORS_ORIGINS: ""
      PORT: ${PORT:-8000}
    volumes:
      - ateval-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; p = int(os.environ.get('PORT', '8000')); assert 1 <= p <= 65535; urllib.request.urlopen(f'http://127.0.0.1:{p}/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
volumes:
  ateval-data:
